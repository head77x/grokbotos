# Grok Bot OS launcher look (design tokens, docs/DESIGN.md).
# Users override with ~/.config/fuzzel/fuzzel.ini.
[main]
font=Noto Sans CJK KR:size=13
icon-theme=Adwaita
width=42
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=10
line-height=28

[colors]
background=18181bf5
text=f2f2f2ff
prompt=a3a3a3ff
input=f2f2f2ff
match=64b5ffff
selection=2a2a2eff
selection-text=f2f2f2ff
selection-match=64b5ffff
border=ffffff24

[border]
width=1
radius=18
