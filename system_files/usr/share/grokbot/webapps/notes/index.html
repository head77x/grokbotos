<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="notes.css">
</head>
<body>
<header>
  <img src="icon.svg" alt="" width="30" height="30">
  <h1 data-t="title">메모</h1>
  <span class="grow"></span>
  <span class="dim" id="where"></span>
  <button type="button" id="lang">English</button>
</header>
<div id="wrap">
  <aside>
    <div class="row"><input type="search" id="q" data-ph="search" placeholder="검색"><button type="button" class="primary" id="new" data-t="new">새 메모</button></div>
    <ul id="list"></ul>
  </aside>
  <section id="ed">
    <input type="text" id="title" data-ph="untitled" placeholder="제목 없음" maxlength="200">
    <textarea id="body" data-ph="write" placeholder="여기에 적으세요…" spellcheck="false"></textarea>
    <div class="row"><span class="dim" id="saved"></span><span class="grow"></span><button type="button" class="danger" id="del" data-t="delete">삭제</button></div>
  </section>
  <section id="empty" class="hidden"><span id="bit"></span><p class="dim" data-t="empty">메모가 없습니다. "새 메모"를 눌러 시작하세요.</p></section>
</div>
<script src="/_grokbot/mascot.js"></script>
<script src="app.js"></script>
</body>
</html>
