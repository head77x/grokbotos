---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  # Chains off build.yml ("Build container image") instead of on push
  # directly -- triggering on push would race build.yml's own container
  # push, and bootc-image-builder would either pull a stale image or fail
  # outright. workflow_run only fires once build.yml's run has fully
  # finished, success or not (checked below).
  workflow_run:
    workflows: ["Build container image"]
    types:
      - completed
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # workflow_run always fires this workflow, even when build.yml failed --
  # this job is the gate that skips everything else in that case. It also
  # picks which platform(s) to build: workflow_dispatch names exactly one
  # (the manual dropdown), everything else (the automatic chain, and PRs
  # touching disk_config/) builds both, matching build.yml's own amd64 +
  # arm64 matrix.
  determine-platforms:
    name: Determine platform(s) to build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'platforms=["${{ inputs.platform }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["amd64","arm64"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build disk images
    needs: determine-platforms
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
        platform: ${{ fromJSON(needs.determine-platforms.outputs.platforms) }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # build.yml pushes amd64/arm64 as distinctly-named images
          # (oais / oais-arm64), not one multi-arch manifest -- select
          # the one matching this matrix leg's platform.
          IMAGE_NAME="${IMAGE_NAME}"
          if [ "${{ matrix.platform }}" = "arm64" ]; then
            IMAGE_NAME="${IMAGE_NAME}-arm64"
          fi
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: matrix.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: matrix.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # docker/login-action authenticates the runner user's config, but the
      # pull below (and bootc-image-builder itself) run as root via sudo,
      # which has its own separate credential store -- so login has to
      # happen as root too, or the pull sees no credentials at all.
      - name: Login to GitHub Container Registry (as root, matches sudo podman below)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # bootc-image-builder no longer pulls the target image itself -- it
      # expects it already present in the same podman storage the build
      # step below mounts (/var/lib/containers/storage), pulled with sudo.
      - name: Pull image for bootc-image-builder
        run: sudo podman pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}

      # iso.toml's kickstart has a hardcoded `bootc switch` target so the
      # installed system tracks the right image post-install -- point it
      # at whichever image (oais vs oais-arm64) this run actually built
      # the ISO from.
      - name: Point ISO kickstart at this run's image
        if: matrix.disk-type == 'anaconda-iso'
        run: |
          sed -i "s#ghcr.io/head77x/oais:latest#${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}#" disk_config/iso.toml

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@56d652d0afb02eb3e4b8fd35e7ca0391dbebab2a # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          # ublue-os/base-main doesn't declare a default root filesystem
          # type in its container metadata, so bootc-image-builder can't
          # infer one ("missing required info: DefaultRootFs") -- has to
          # be set explicitly. ext4 for simplicity; revisit if Phase 3's
          # sandbox or Phase 6 branding wants btrfs subvolumes/snapshots.
          additional-args: --use-librepo=True --rootfs ext4

      # Downloading a multi-GB image through GitHub's artifact zip UI is the
      # slow part of this whole workflow, not the build itself -- direct-
      # to-S3 upload skips that entirely. Automatic (no manual toggle to
      # remember) whenever AWS_ACCESS_KEY_ID and AWS_S3_BUCKET repo secrets
      # are set; falls back to the old GitHub Artifact upload otherwise so
      # a clone without S3 configured still works.
      - name: Check whether S3 upload is configured
        id: aws-check
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_S3_BUCKET }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload disk images to S3
        if: steps.aws-check.outputs.configured == 'true' && github.event_name != 'pull_request'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS CLI needs a region even for a bucket that already exists
          # elsewhere -- it just needs one to construct the endpoint URL.
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          command -v aws >/dev/null 2>&1 || pip install --quiet awscli
          S3_PREFIX="s3://${{ secrets.AWS_S3_BUCKET }}/oais/${{ env.DISK_TYPE }}-${{ matrix.platform }}/"
          aws s3 cp --recursive --no-progress "${{ steps.build.outputs.output-directory }}" "$S3_PREFIX"
          echo "### Uploaded to S3" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$S3_PREFIX\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload disk images and Checksum to Job Artifacts (S3 not configured)
        if: steps.aws-check.outputs.configured != 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Matrix legs default to the same artifact name ("artifact") if
          # not set explicitly -- with overwrite: true below that means
          # whichever leg (qcow2 vs anaconda-iso) finishes last silently
          # replaces the other's upload instead of both being kept.
          name: oais-${{ env.DISK_TYPE }}-${{ matrix.platform }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
